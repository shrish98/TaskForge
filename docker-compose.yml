version: '3.8'

services:
  # 1. PostgreSQL Database Service
  postgres:
    image: postgres:16-alpine
    container_name: saarthi_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-saarthi_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-saarthi_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-saarthi_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-saarthi_admin} -d ${POSTGRES_DB:-saarthi_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - saarthi_network

  # 2. Redis Cache & Queue Manager
  redis:
    image: redis:7-alpine
    container_name: saarthi_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - saarthi_network

  # 3. Express API Gateway & Socket Server
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: saarthi_server
    restart: always
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-saarthi_admin}:${POSTGRES_PASSWORD:-saarthi_password_2026}@postgres:5432/${POSTGRES_DB:-saarthi_db}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-saarthi_super_secret_access_key_2026_change_in_prod}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-saarthi_super_secret_refresh_key_2026_change_in_prod}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - saarthi_network

  # 4. BullMQ Background Worker Service
  worker:
    build:
      context: ./server
      dockerfile: Dockerfile.worker
    container_name: saarthi_worker
    restart: always
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-saarthi_admin}:${POSTGRES_PASSWORD:-saarthi_password_2026}@postgres:5432/${POSTGRES_DB:-saarthi_db}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - saarthi_network

  # 5. Next.js Micro-SaaS Frontend Dashboard
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: saarthi_client
    restart: always
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5000/api/v1
      NEXT_PUBLIC_SOCKET_URL: http://localhost:5000
    depends_on:
      - server
    networks:
      - saarthi_network

networks:
  saarthi_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
