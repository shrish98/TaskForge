name: CI/CD Pipeline - TaskForge Job Processing Engine

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # 1. Backend Lint & Test Job
  backend-ci:
    name: Backend API & Worker CI
    runs-on: ubuntu-latest

    # Throwaway databases for the integration tests, which run real jobs on a real BullMQ worker.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: taskforge
          POSTGRES_PASSWORD: taskforge
          POSTGRES_DB: taskforge_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U taskforge -d taskforge_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://taskforge:taskforge@localhost:5432/taskforge_test?schema=public
      TEST_REDIS_URL: redis://localhost:6379/1

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v5

      - name: Setup Node.js Environment
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install Backend Dependencies
        working-directory: server
        run: npm ci

      - name: Generate Prisma Client
        working-directory: server
        run: npx prisma generate

      - name: Type Check
        working-directory: server
        run: npx tsc --noEmit

      - name: Unit Tests
        working-directory: server
        run: npm test

      - name: Apply Migrations to the Test Database
        working-directory: server
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      - name: Integration Tests (API, worker, retries, dead-letter queue, OCR)
        working-directory: server
        run: npm run test:integration

  # 2. Frontend Lint & Build Job
  frontend-ci:
    name: Next.js Frontend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v5

      - name: Setup Node.js Environment
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install Frontend Dependencies
        run: |
          cd client
          npm install --include=dev

      - name: Run Frontend TypeScript & Build Verification
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000/api/v1
          NEXT_PUBLIC_SOCKET_URL: http://localhost:5000
          NEXT_TELEMETRY_DISABLED: 1
        run: |
          cd client
          npx next build

  # 3. Docker Compose Build Verification Job
  docker-build-ci:
    name: Docker Container Build Verification
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        continue-on-error: true

      - name: Build Docker Containers Configuration
        run: |
          docker compose config
