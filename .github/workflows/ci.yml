name: CI/CD Pipeline - Saarthi AI Job Processing Engine

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # 1. Backend Lint & Test Job
  backend-ci:
    name: Backend API & Worker CI
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: saarthi_admin
          POSTGRES_PASSWORD: saarthi_password_2026
          POSTGRES_DB: saarthi_db_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Backend Dependencies
        run: |
          cd server
          npm install

      - name: Generate Prisma Client
        run: |
          cd server
          npx prisma generate

      - name: Run Backend TypeScript Type Checking
        run: |
          cd server
          npx tsc --noEmit

      - name: Execute Backend Unit & API Tests
        env:
          DATABASE_URL: postgresql://saarthi_admin:saarthi_password_2026@localhost:5432/saarthi_db_test?schema=public
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_ACCESS_SECRET: test_jwt_access_secret
          JWT_REFRESH_SECRET: test_jwt_refresh_secret
        run: |
          cd server
          npm test -- --passWithNoTests

  # 2. Frontend Lint & Build Job
  frontend-ci:
    name: Next.js Frontend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Frontend Dependencies
        run: |
          cd client
          npm install --legacy-peer-deps

      - name: Run Frontend TypeScript & Build Verification
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000/api/v1
          NEXT_PUBLIC_SOCKET_URL: http://localhost:5000
        run: |
          cd client
          npm run build

  # 3. Docker Compose Build Verification Job
  docker-build-ci:
    name: Docker Container Build Verification
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        continue-on-error: true

      - name: Build Docker Containers Configuration
        run: |
          docker compose config
