
name: CD Pipeline - Deploy TaskForge to AWS EC2

on:
  push:
    branches: [ main, master ]

jobs:
  deploy-to-ec2:
    name: Deploy TaskForge Stack to AWS EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to AWS EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "🚀 Starting TaskForge Deployment on EC2..."
            
            # Navigate to project directory (Adjust directory path if needed)
            if [ -d "TaskForge" ]; then
              cd TaskForge
            fi

            # Fetch latest changes from GitHub
            git fetch --all
            git reset --hard origin/${{ github.ref_name }}

            # Rebuild and restart containerized services in background
            docker compose up --build -d

            # Clean up old unused Docker build caches to save EC2 disk space
            docker image prune -f

            echo "✅ TaskForge deployment successfully completed!"
